<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momentum — Set New Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .auth-card { width:min(420px,100%); background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:2.5rem; border-top:3px solid var(--task); }
    .auth-brand { text-align:center; margin-bottom:2rem; }
    .auth-brand-icon { font-size:2rem; color:var(--habit); display:block; margin-bottom:.5rem; animation:spin 20s linear infinite; }
    .auth-brand-name { font-family:var(--font-serif); font-size:2rem; font-weight:400; color:var(--cream); }
    .auth-field  { margin-bottom:1rem; }
    .auth-label  { display:block; font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--cream-muted); margin-bottom:.4rem; }
    .auth-input  { width:100%; background:var(--bg-card); border:1px solid var(--border-light); border-radius:var(--radius-sm); color:var(--cream); font-family:var(--font-sans); font-size:.95rem; padding:.75rem 1rem; outline:none; transition:border-color .2s; }
    .auth-input:focus { border-color:var(--task); }
    .auth-input::placeholder { color:var(--cream-muted); }
    .auth-submit { width:100%; background:var(--task); border:none; color:#000; font-family:var(--font-sans); font-size:.95rem; font-weight:600; padding:.8rem; border-radius:999px; cursor:pointer; margin-top:.5rem; transition:opacity .2s; }
    .auth-submit:hover { opacity:.85; }
    .auth-submit:disabled { opacity:.5; cursor:not-allowed; }
    .auth-error   { background:rgba(192,97,74,.15); border:1px solid var(--danger); color:#e88a77; font-size:.82rem; padding:.6rem 1rem; border-radius:var(--radius-sm); margin-bottom:1rem; display:none; }
    .auth-success { background:rgba(126,200,164,.12); border:1px solid var(--task); color:var(--task); font-size:.82rem; padding:.6rem 1rem; border-radius:var(--radius-sm); margin-bottom:1rem; display:none; }
    .auth-error.show, .auth-success.show { display:block; }
    .state-checking, .state-invalid { text-align:center; padding:1rem 0; }
    .state-icon { font-size:2.5rem; margin-bottom:.75rem; }
    .state-msg { color:var(--cream-muted); font-size:.9rem; line-height:1.5; }
    .strength-bar { height:4px; border-radius:999px; background:var(--border); margin-top:.4rem; overflow:hidden; }
    .strength-fill { height:100%; border-radius:999px; transition:width .3s, background .3s; width:0%; }
    .strength-label { font-size:.7rem; color:var(--cream-muted); margin-top:.3rem; }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-brand">
      <span class="auth-brand-icon">◈</span>
      <div class="auth-brand-name">Momentum</div>
    </div>

    <!-- Shown while we verify the token -->
    <div id="state-checking" class="state-checking">
      <div class="state-icon">⏳</div>
      <div class="state-msg">Verifying your reset link...</div>
    </div>

    <!-- Shown if token is invalid or expired -->
    <div id="state-invalid" class="state-invalid" style="display:none">
      <div class="state-icon">✕</div>
      <div class="state-msg" id="invalidMsg">This reset link is invalid or has expired.</div>
      <a href="/login" style="display:inline-block;margin-top:1rem;color:var(--habit);font-size:.85rem;">
        ← Back to login
      </a>
    </div>

    <!-- Shown when token is valid — the actual form -->
    <div id="state-form" style="display:none">
      <h3 style="font-family:var(--font-serif);font-weight:400;color:var(--cream);margin-bottom:.4rem;">
        Set New Password
      </h3>
      <p style="font-size:.82rem;color:var(--cream-muted);margin-bottom:1.5rem;">
        Choose a strong password you haven't used before.
      </p>

      <div class="auth-error"   id="formError"></div>
      <div class="auth-success" id="formSuccess"></div>

      <div class="auth-field">
        <label class="auth-label">New Password</label>
        <input class="auth-input" type="password" id="newPassword"
               placeholder="at least 6 characters"
               oninput="updateStrength(this.value)"
               onkeydown="if(event.key==='Enter') submitReset()" />
        <!-- Visual password strength indicator -->
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>

      <div class="auth-field">
        <label class="auth-label">Confirm Password</label>
        <input class="auth-input" type="password" id="confirmPassword"
               placeholder="type it again"
               onkeydown="if(event.key==='Enter') submitReset()" />
      </div>

      <button class="auth-submit" id="submitBtn" onclick="submitReset()">
        Update Password
      </button>
    </div>

  </div>
</div>

<script>
  const API = "http://127.0.0.1:5000/api";

  // Extract token from URL: /reset-password?token=abc123
  // URLSearchParams parses the query string for us
  const token = new URLSearchParams(window.location.search).get("token");

  // ── On page load: verify the token with the server ───────────────────────────
  // We do this BEFORE showing the form
  // No point showing a form if the token is already expired
  window.addEventListener("DOMContentLoaded", async () => {
    if (!token) {
      return showState("invalid", "No reset token found in the link.");
    }
    try {
      const res  = await fetch(`${API}/verify-reset-token`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token })
      });
      const data = await res.json();
      if (data.valid) {
        showState("form");      // Token is good → show the password form
      } else {
        showState("invalid", data.error);  // Token bad/expired → show error
      }
    } catch {
      showState("invalid", "Could not reach the server. Is it running?");
    }
  });

  function showState(name, msg = "") {
    document.getElementById("state-checking").style.display = name === "checking" ? "block" : "none";
    document.getElementById("state-invalid").style.display  = name === "invalid"  ? "block" : "none";
    document.getElementById("state-form").style.display     = name === "form"     ? "block" : "none";
    if (msg) document.getElementById("invalidMsg").textContent = msg;
  }

  // ── Password strength indicator ───────────────────────────────────────────────
  function updateStrength(pwd) {
    const fill  = document.getElementById("strengthFill");
    const label = document.getElementById("strengthLabel");
    let score = 0;
    if (pwd.length >= 6)  score++;
    if (pwd.length >= 10) score++;
    if (/[A-Z]/.test(pwd)) score++;   // has uppercase
    if (/[0-9]/.test(pwd)) score++;   // has number
    if (/[^A-Za-z0-9]/.test(pwd)) score++;  // has special char

    const levels = [
      { pct: "0%",   color: "transparent", text: "" },
      { pct: "25%",  color: "#c0614a",     text: "Weak" },
      { pct: "50%",  color: "#e8b86d",     text: "Fair" },
      { pct: "75%",  color: "#a8c86d",     text: "Good" },
      { pct: "100%", color: "#7ec8a4",     text: "Strong 💪" },
    ];
    const level = levels[Math.min(score, 4)];
    fill.style.width      = level.pct;
    fill.style.background = level.color;
    label.textContent     = level.text;
  }

  // ── Submit new password ───────────────────────────────────────────────────────
  async function submitReset() {
    const password = document.getElementById("newPassword").value;
    const confirm  = document.getElementById("confirmPassword").value;

    if (!password) return showFormError("Please enter a new password.");
    if (password.length < 6) return showFormError("Password must be at least 6 characters.");
    if (password !== confirm) return showFormError("Passwords don't match.");

    const btn = document.getElementById("submitBtn");
    btn.textContent = "Updating...";
    btn.disabled    = true;

    try {
      const res  = await fetch(`${API}/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",   // So the server can log us in after reset
        body: JSON.stringify({ token, password })
      });
      const data = await res.json();

      if (!res.ok) {
        showFormError(data.error);
        btn.textContent = "Update Password";
        btn.disabled    = false;
      } else {
        // Success — show message then redirect to app
        document.getElementById("formError").classList.remove("show");
        const s = document.getElementById("formSuccess");
        s.textContent = "Password updated! Redirecting you to the app...";
        s.classList.add("show");
        document.getElementById("newPassword").disabled    = true;
        document.getElementById("confirmPassword").disabled = true;
        btn.style.display = "none";
        setTimeout(() => { window.location.href = "/"; }, 2000);
      }
    } catch {
      showFormError("Could not reach the server.");
      btn.textContent = "Update Password";
      btn.disabled    = false;
    }
  }

  function showFormError(msg) {
    const e = document.getElementById("formError");
    e.textContent = msg;
    e.classList.add("show");
  }
</script>
</body>
</html>
